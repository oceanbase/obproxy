
# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

variables:
  observer_branch: ''


stages:          # List of stages for jobs, and their order of execution
  - post-core-test

post-core-test:   # This job runs in the test stage.
  stage: post-core-test    # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Current user login" ${GITLAB_USER_LOGIN}
    - echo "Current COMMIT" ${CI_COMMIT_SHA}
    - if [[ "${observer_branch}"x == 'x' ]]; then   if [[ -f test/observer_test_config.yaml ]] ;   then       observer_branch=$(python2 -c 'import yaml;print(yaml.safe_load(open("test/observer_test_config.yaml"))["branch"])');   else       observer_branch="master";   fi; fi
    - echo $observer_branch
    - |
       set -x
       res=$(curl -X POST "https://work.oceanbase-dev.com/farm2/templates/odp_core_test/tasks?wno=${GITLAB_USER_LOGIN}&domain_account=${GITLAB_USER_LOGIN}&token=${FARM2_TOKEN}" -H 'Content-Type: application/json' -d "{\"parameters\": {\"BRANCH\": \"${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}\", \"COMMIT\": \"${CI_COMMIT_SHA}\", \"MRID\": \"${mrId}\", \"OBSERVER_BRANCH\": \"$observer_branch\" } }")
    - echo $res
    - |
       [[ $res =~ '"code":200' ]]
    - |
       task_id=`echo $res |jq .data.id`
       res=$(curl -X PUT "${CALLBACK_URL}" -H 'Content-Type: application/json' -d "{\"name\": \"odp_core_test\", \"state\": 2, \"description\": \"running\",\"target_url\": \"https://work.oceanbase-dev.com/farm2-web/embed/task-detail?taskId=${task_id}\", \"task_id\": \"${task_id}\", \"project_id\": 974,  \"branch\": \"${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}\", \"commit_id\": \"${CI_COMMIT_SHA}\"}")
  only:
    - merge_requests
